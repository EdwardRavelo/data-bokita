# Visita las páginas principales cada hora para que Vercel las regenere (ISR).
# Sin esto, la primera persona que entra después de un rato sin visitas ve la versión
# vieja (Vercel la sirve "STALE" mientras regenera) y tiene que recargar.
name: Refrescar páginas

on:
  schedule:
    - cron: "17 * * * *" # cada hora (minuto 17 para evitar el pico de las en punto)
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh
  cancel-in-progress: true

env:
  SITE_URL: https://data-bokita.vercel.app

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visitar páginas
        run: |
          year=$(TZ=America/Argentina/Buenos_Aires date +%Y)
          paths="/ /partidos /partidos/$year /estadisticas /estadisticas/$year /tablas /tablas/$year /noticias"

          visit() {
            for p in $paths; do
              out=$(curl -s -o /dev/null -D - -w 'HTTP %{http_code}' --max-time 60 "$SITE_URL$p")
              cache=$(echo "$out" | grep -i '^x-vercel-cache:' | tr -d '\r' | cut -d' ' -f2)
              code=$(echo "$out" | tail -n1)
              echo "$p → $code ${cache:-?}"
              [ "$code" = "HTTP 200" ] || failed=1
            done
          }

          failed=0
          # 1ª pasada: las páginas vencidas se regeneran en segundo plano.
          visit
          sleep 30
          # 2ª pasada: confirma que ya quedó la versión nueva.
          echo "---"
          visit
          exit $failed
